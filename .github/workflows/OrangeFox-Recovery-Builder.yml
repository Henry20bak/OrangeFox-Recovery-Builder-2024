name: Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'ManifestURL'
        required: true
        default: 'https://gitlab.com/OrangeFox/Manifest.git'
      MANIFEST_BRANCH:
        description: 'ManifestBranch'
        required: true
        default: 'fox_12.1'
      DEVICE_TREE_URL:
        description: 'DeviceTreeURL'
        required: true
        default: 'https://github.com/Henry20bak/recovery_xiaomi_lake.git'
      DEVICE_TREE_BRANCH:
        description: 'DeviceTreeBranch'
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'DevicePath'
        required: true
        default: 'device/xiaomi/lake'
      DEVICE_NAME:
        description: 'DeviceName'
        required: true
        default: 'Poco C75'
      DEVICE_CODE:
        description: 'DeviceCodename'
        required: true
        default: 'lake'
      VENDOR_BOOT:
        description: 'For devices that use a vendor_boot.img'
        required: true
        default: 'true'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        run: |
          sudo swapoff -a
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Set Variables
        run: |
          echo "HOME=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          echo "OUT_DIR=${GITHUB_WORKSPACE}/work/out/target/product/${{ github.event.inputs.DEVICE_CODE }}" >> $GITHUB_ENV
          echo "TZ=Asia/Jakarta" >> $GITHUB_ENV

      - name: Install Some Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install cpio wget xz-utils gzip bzip2
          sudo apt-get install python3 python3-pip git tmate axel -y
          sudo pip3 install pytz

      - name: Install Required Packages
        run: |
          sudo apt-get update
          sudo apt-get -y upgrade
          sudo apt-get -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev python

      - name: Install OpenJDK
        run: |
          sudo apt-get update
          sudo apt-get install openjdk-8-jdk -y

      - name: Install Git-Repo
        run: |
          mkdir ~/bin
          echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          
      - name: Initialize Repo
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/work
          cd ${GITHUB_WORKSPACE}/work
          git config --global user.name "Henry20bak"
          git config --global user.email "henriekens@gmail.com"
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
          
      - name: Sync Repo
        run: |
          cd ${GITHUB_WORKSPACE}/work
          repo sync -j$(nproc --all) -f --force-sync
          ls -la

      - name: Clone Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/work
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}
          
      - name: Create OrangeFox Vendorsetup
        run: |
          cd ${GITHUB_WORKSPACE}/work
          mkdir -p ${GITHUB_WORKSPACE}/work/${{ github.event.inputs.DEVICE_PATH }}/vendorsetup
          cat <<EOF > ${GITHUB_WORKSPACE}/work/${{ github.event.inputs.DEVICE_PATH }}/vendorsetup/fox_12.1.sh
          # OrangeFox build variables for ${{ github.event.inputs.DEVICE_NAME }}
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_VERSION="R11.1"
          export FOX_BUILD_TYPE="Unofficial"
          export FOX_VARIANT="A12"
          export OF_MAINTAINER="Henry20bak"
          export OF_AB_DEVICE=1
          export OF_VIRTUAL_AB_DEVICE=1
          export OF_NO_SPLASH_CHANGE=0
          export OF_DONT_PATCH_ENCRYPTED_DEVICE=1
          export OF_USE_MAGISKBOOT_FOR_ALL_PATCHES=1
          export FOX_USE_SPECIFIC_MAGISK_ZIP=~/Magisk/Magisk-v26.4.zip
          export OF_ENABLE_LPTOOLS=1
          # Additional customizations
          export OF_SKIP_DECRYPTED_ADOPTED_STORAGE=1
          export OF_NO_TREBLE_COMPATIBILITY_CHECK=1
          EOF
          
      - name: Check Device Tree
        run: |
          cd ${GITHUB_WORKSPACE}/work
          ls -la ${{ github.event.inputs.DEVICE_PATH }}
          
      - name: Apply Readonly-Buildfiles Patch
        run: |
          cd ${GITHUB_WORKSPACE}/work
          sed -i 's/readonly-buildfiles.txt/readonly-buildfiles.bak/g' build/make/core/Makefile
          touch build/make/core/readonly-buildfiles.bak
          
      - name: Build OrangeFox Recovery
        run: |
          cd ${GITHUB_WORKSPACE}/work
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_${{ github.event.inputs.DEVICE_CODE }}-eng
          mka recoveryimage
          
      - name: List Files After Build
        run: |
          cd ${OUT_DIR}
          ls -la
          
      - name: Upload Recovery Image
        uses: actions/upload-artifact@v3
        with:
          name: OrangeFox-Recovery-${{ github.event.inputs.DEVICE_CODE }}
          path: |
            ${{ env.OUT_DIR }}/*.img
            ${{ env.OUT_DIR }}/*.zip
            
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ github.event.inputs.DEVICE_CODE }}-${{ github.run_id }}
          name: OrangeFox-${{ github.event.inputs.DEVICE_CODE }}-${{ github.run_id }}
          files: |
            ${{ env.OUT_DIR }}/*.img
            ${{ env.OUT_DIR }}/*.zip
          body: OrangeFox Recovery for ${{ github.event.inputs.DEVICE_NAME }} (${{ github.event.inputs.DEVICE_CODE }})
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}